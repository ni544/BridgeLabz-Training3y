<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Registration - Nikunj Tiwari</title>
</head>
<body>
    <h1>Course Registration Form</h1>

    <!-- Registration fields grouped using fieldset and legend -->
    <form>
        <fieldset>
            <legend>Student Information</legend>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="Madhav Kumar">
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="MK9142812668@gmail.com">
            <br><br>

            <label for="course">Select Course:</label>
            <select id="course" name="course">
                <option value="btech">B.Tech</option>
                <option value="python">Python Programming</option>
                <option value="data">Data Science</option>
            </select>
            <br><br>

            <input type="submit" value="Register">
        </fieldset>
    </form>

    <!-- Available course schedules -->
    <h2>Available Course Schedules</h2>
    <table border="1">
        <tr><th>Day</th><th>Time</th><th>Instructor</th></tr>
        <tr><td>Monday</td><td>10:00 AM - 12:00 PM</td><td>Mr. Amit</td></tr>
        <tr><td>Wednesday</td><td>2:00 PM - 4:00 PM</td><td>Ms. Priya</td></tr>
        <tr><td>Friday</td><td>11:00 AM - 1:00 PM</td><td>Dr. Raj</td></tr>
    </table>
</body>
</html>
