<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dropdown Selection</title>
</head>
<body>
    <h1>Travel Selection</h1>

    <!-- Each dropdown has a pre-selected option -->
    <form>
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option selected>India</option>
            <option>Japan</option>
            <option>France</option>
        </select>
        <br><br>

        <label for="state">State:</label>
        <select id="state" name="state">
            <option selected>Uttar Pradesh</option>
            <option>Delhi</option>
            <option>Maharashtra</option>
        </select>
        <br><br>

        <label for="city">City:</label>
        <select id="city" name="city">
            <option selected>Mathura</option>
            <option>Lucknow</option>
            <option>Agra</option>
        </select>
        <br><br>

        <label for="place">Favorite Tourist Place:</label>
        <select id="place" name="place">
            <option selected>Taj Mahal</option>
            <option>Vrindavan</option>
            <option>Gateway of India</option>
        </select>
    </form>

    <p>Madhav Kumar's selected choices are India, Uttar Pradesh, Mathura, and Taj Mahal.</p>
</body>
</html>
